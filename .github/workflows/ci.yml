# Minimal CI (Phase 15) — ordered checks, no complex matrix.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"
  # CI-only placeholders (not production secrets)
  SECRET_KEY: "ci-secret-key-at-least-32-characters-long!!"
  FERNET_KEY: "8AIvnc0fkkQ7DXLPd3q9XGPoPHnzN137KV5RwPxcsBw="
  APP_ENV: development
  DEBUG: "false"

jobs:
  backend:
    name: Backend (lint → test → migrate → audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: voice_asst
          POSTGRES_PASSWORD: voice_asst
          POSTGRES_DB: voice_asst_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U voice_asst -d voice_asst_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Ruff
        run: ruff check app run.py asgi.py voice_asgi.py

      - name: Mypy
        run: mypy

      - name: Pytest
        working-directory: ${{ github.workspace }}
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          PYTHONPATH: backend
          DATABASE_URL: sqlite://
        run: pytest backend/tests -q

      - name: Migration test
        env:
          DATABASE_URL: postgresql://voice_asst:voice_asst@localhost:5432/voice_asst_ci
          PYTHONPATH: .
        run: |
          alembic upgrade head
          # Prove head is idempotent against an already-migrated database
          alembic upgrade head

      - name: Dependency security audit
        # Reports known vulnerabilities. continue-on-error keeps CI green while
        # still surfacing audit output for follow-up dependency bumps.
        continue-on-error: true
        run: pip-audit -r requirements.txt

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Test
        run: npm test -- --run

      - name: Build
        run: npm run build

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.backend
          push: false
          tags: voice-assistant-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.frontend
          push: false
          tags: voice-assistant-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_API_BASE_URL=
